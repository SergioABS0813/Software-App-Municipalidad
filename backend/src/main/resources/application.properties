spring.application.name=municipalidad-backend-app

#Puerto que se usaré para ejecutar la aplicaci?n
server.port=8080

#MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

#JPA (validación de entidades, mostrar SQL en consola y formatear el SQL)
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Keycloak Admin API
keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
keycloak.admin.activation-client-id=${KEYCLOAK_ACTIVATION_CLIENT_ID:}
keycloak.admin.activation-redirect-uri=${KEYCLOAK_ACTIVATION_REDIRECT_URI:}

# Mail notifications
app.frontend.base-url=${APP_FRONTEND_BASE_URL:}
app.frontend-url=${APP_FRONTEND_URL:${APP_FRONTEND_BASE_URL:}}

app.mail.enabled=${APP_MAIL_ENABLED:}
app.mail.from-name=${APP_MAIL_FROM_NAME:}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:}
# Google Cloud Storage
app.storage.bucket-recursos=${GCS_BUCKET_RECURSOS:}
app.storage.bucket-inscripciones=${GCS_BUCKET_INSCRIPCIONES:}
app.storage.signed-url-minutes=${GCS_SIGNED_URL_MINUTES:30}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:}
# Dni API
TOKEN_DNI_API=${TOKEN_DNI_API:}
app.pagos.whatsapp-reclamos=${APP_PAGOS_WHATSAPP_RECLAMOS:999999999}

# Satisfaction ratings
app.valoraciones.scheduler.fixed-delay-ms=${APP_VALORACIONES_SCHEDULER_FIXED_DELAY_MS:300000}
app.valoraciones.expiracion-dias=${APP_VALORACIONES_EXPIRACION_DIAS:7}

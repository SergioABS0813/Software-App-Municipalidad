spring.application.name=municipalidad-backend-app

#Puerto que se usará para ejecutar la aplicación
server.port=8080

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/muni_san_miguel_v2?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Logging SQL (Consulta y parámetros)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
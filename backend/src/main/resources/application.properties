spring.application.name=municipalidad-backend-app

#Puerto que se usará para ejecutar la aplicación
server.port=8080

#MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=root
spring.datasource.password=root

#JPA (validación de entidades, mostrar SQL en consola y formatear el SQL)
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Keycloak Admin API
keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
keycloak.admin.activation-client-id=${KEYCLOAK_ACTIVATION_CLIENT_ID:}
keycloak.admin.activation-redirect-uri=${KEYCLOAK_ACTIVATION_REDIRECT_URI:}

# Mail notifications
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

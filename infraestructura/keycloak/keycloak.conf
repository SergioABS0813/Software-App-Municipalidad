# ==== Configuración compartida y estable ====

# Motor de base de datos a usar
db=postgres
#Nombre de la base de datos
db-url-database=keycloak
#Direccion donde se aloja la DB - Nombre contenedor
db-url-host=postgres-keycloak 

health-enabled=true
metrics-enabled=true

http-enabled=true
proxy-headers=xforwarded
hostname=http://localhost:7000
server{
    listen 80;
    server_name municipalidadsm.online www.municipalidadsm.online;
    return 301 https://$host$request_uri;
}

server{
    listen 443 ssl;
    server_name municipalidadsm.online www.municipalidadsm.online;

    ssl_certificate /etc/ssl/cloudflare/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:5173
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://10.10.2.10:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name auth.municipalidadsm.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.municipalidadsm.online;

    ssl_certificate /etc/ssl/cloudflare/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cloudflare-origin.key;

    location / {
        proxy_pass http://10.10.2.10:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

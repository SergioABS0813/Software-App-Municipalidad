executeActionsSubject=Configura tu contraseña de acceso
executeActionsBody=Hola.\n\nLa Municipalidad de San Miguel solicita que configures tu contraseña de acceso al Sistema de Gestión de Eventos.\n\nPara continuar de forma segura, abre el siguiente enlace:\n\n{0}\n\nEste enlace expirará en {4}.\n\nSi no reconoces esta solicitud, puedes ignorar este mensaje. No se realizará ningún cambio en tu cuenta.

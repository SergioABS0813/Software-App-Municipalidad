emailVerificationSubject=Verifica tu correo electrónico
emailVerificationBody=Hola.\n\nSe creó una cuenta en el Sistema de Gestión de Eventos de la Municipalidad de San Miguel con esta dirección de correo. Para confirmar que te pertenece, abre el siguiente enlace:\n\n{0}\n\nEste enlace expirará en {3}.\n\nSi no reconoces esta solicitud, ignora este mensaje. No se realizará ningún cambio.
emailVerificationBodyHtml=<p>Verifica tu correo electrónico</p><p>Se creó una cuenta en el Sistema de Gestión de Eventos de la Municipalidad de San Miguel con esta dirección de correo. Para confirmar que te pertenece, usa el siguiente botón.</p><p><a href="{0}">Verificar mi correo</a></p><p>Este enlace expirará en {3}.</p><p>Si no reconoces esta solicitud, ignora este mensaje. No se realizará ningún cambio.</p>

